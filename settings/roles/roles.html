<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PMP Roles</title>
    <link rel="icon" href="/pmp-favicon.ico">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/settings/roles/roles.css">
</head>

<body data-page="Roles" data-admin-only="true" data-auth-defer="true" class="auth-pending">

    <div class="app">

        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Main content -->
        <main class="main-content">

            <!-- Header -->
            <header id="topbar-container"></header>

            <!-- Roles content -->
            <section class="content">

                <div class="page-header">
                    <div>
                        <h1>Roles</h1>
                        <p>Manage system roles and permissions.</p>
                    </div>

                    <button type="button" id="create-role-button">
                        Create Role
                    </button>
                </div>

                <section class="roles-section">

                    <div class="section-header">
                        <h2>Roles</h2>
                    </div>

                    <div class="table-container">

                        <table class="roles-table">

                            <thead>
                                <tr>
                                    <th>Role</th>
                                    <th>Description</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>

                            <tbody id="roles-table-body">
                                <tr>
                                    <td colspan="4">Loading roles...</td>
                                </tr>
                            </tbody>

                        </table>

                    </div>

                </section>

            </section>

        </main>

    </div>

    <!-- Role modal -->
    <div id="role-modal" class="modal hidden">

        <div id="role-modal-overlay" class="modal-overlay"></div>

        <div class="modal-content">

            <div class="modal-header">

                <div>
                    <h2 id="role-modal-title">Create Role</h2>
                    <p>Define the role and assign its permissions.</p>
                </div>

                <button
                    type="button"
                    id="close-role-modal"
                    class="modal-close">
                    ×
                </button>

            </div>

            <form id="role-form">

                <input type="hidden" id="role-id">

                <div class="form-group">

                    <label for="role-name">
                        Role Name
                    </label>

                    <input
                        type="text"
                        id="role-name"
                        name="role-name"
                        maxlength="100"
                        required>

                </div>

                <div class="form-group">

                    <label for="role-description">
                        Description
                    </label>

                    <textarea
                        id="role-description"
                        name="role-description"
                        maxlength="250"
                        rows="3"></textarea>

                </div>

                <div class="permissions-section">

                    <div class="permissions-header">

                        <div>
                            <h3>Permissions</h3>
                            <p>Select the permissions assigned to this role.</p>
                        </div>

                        <button
                            type="button"
                            id="clear-permissions-button"
                            class="secondary-button">
                            Clear All
                        </button>

                    </div>

                    <div id="permissions-container">
                        <p>Loading permissions...</p>
                    </div>

                </div>

                <div
                    id="role-form-message"
                    class="form-message">
                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        id="cancel-role-button"
                        class="secondary-button">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="save-role-button">
                        Create Role
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>

    <script src="/components/sidebar/sidebar.js"></script>
    <script src="/components/topbar/topbar.js"></script>
    <script src="/settings/roles/roles.js"></script>

    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

</body>

</html>
