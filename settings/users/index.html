<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMP Users</title>
    <link rel="icon" href="/pmp-favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/settings/users/users.css">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body data-page="Users" data-admin-only="true" data-auth-defer="true" class="auth-pending">
    <div class="app">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header id="topbar-container"></header>
            <section class="content">
                <div class="page-header">
                    <div>
                        <h1>Users</h1>
                        <p>Manage system users and their access roles.</p>
                    </div>
                    <button type="button" id="create-user-button">Create User</button>
                </div>
                <section class="users-section">

                <div class="section-header users-section-header">
                    <h2>System Users</h2>
                    <div class="users-search">
                        <input
                            type="search"
                            id="users-search-input"
                            placeholder="Search by employee number, name, role or status..."
                            aria-label="Search users"
                            autocomplete="off"
                        >
                        <button type="button" id="clear-users-search" aria-label="Clear search" hidden>×</button>
                    </div>
                </div>

                    <div class="table-container">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>Employee Number</th>
                                    <th>Name</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <tr>
                                    <td colspan="5">Loading users...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </section>

            <div id="user-modal" class="modal hidden">
                <div class="modal-overlay" data-action="close-user-modal"></div>
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="user-modal-title">Create User</h2>
                        <button type="button" id="close-user-modal" aria-label="Close">×</button>
                    </div>
                    <form id="user-form">
                        <div class="form-group">
                            <label for="employee-number">Employee Number</label>
                            <input
                                type="text"
                                id="employee-number"
                                name="employee_number"
                                maxlength="30"
                                pattern="[A-Za-z0-9_-]{1,30}"
                                required
                                autocomplete="off"
                            >
                        </div>
                        <div class="form-group">
                            <label for="full-name">Full Name</label>
                            <input
                                type="text"
                                id="full-name"
                                name="full_name"
                                required
                            >
                        </div>
                        <div class="form-group">
                            <label for="user-role">Role</label>
                            <select id="user-role" name="role_id" required>
                                <option value="">Select a role</option>
                            </select>
                        </div>
                        <div class="form-group" id="temporary-password-group">
                            <label for="temporary-password">Temporary Password</label>
                            <input
                                type="password"
                                id="temporary-password"
                                name="temporary_password"
                                minlength="8"
                                required
                                autocomplete="new-password"
                            >
                        </div>
                        <div id="user-form-message" class="form-message"></div>
                        <div class="modal-footer">
                            <button type="button" id="cancel-user-button">Cancel</button>
                            <button type="submit" id="save-user-button">Create User</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="user-actions-modal" class="modal hidden">
                <div class="modal-overlay" data-action="close-actions-modal"></div>
                <section class="user-actions-modal-content" role="dialog" aria-modal="true" aria-labelledby="actions-user-name">
                    <div class="user-actions-modal-header">
                        <div class="user-summary">
                            <div class="user-avatar">
                                <span id="actions-user-initial">U</span>
                            </div>
                            <div>
                                <h2 id="actions-user-name">User Name</h2>
                                <p id="actions-user-details">Employee Number · Role</p>
                            </div>
                        </div>
                        <button type="button" id="close-actions-modal" class="close-actions-button" aria-label="Close">×</button>
                    </div>
                    <div class="user-actions-grid">
                        <button type="button" class="user-action-card" data-user-action="edit">
                            <span class="user-action-icon">✎</span>
                            <strong>Edit User</strong>
                            <span>Modify name and role.</span>
                        </button>
                        <button type="button" class="user-action-card" data-user-action="reset-password">
                            <span class="user-action-icon">⚿</span>
                            <strong>Reset Password</strong>
                            <span>Assign a temporary password.</span>
                        </button>
                        <button type="button" class="user-action-card" data-user-action="deactivate">
                            <span class="user-action-icon">♙</span>
                            <strong>Deactivate User</strong>
                            <span>Block access without deleting the account.</span>
                        </button>
                        <button type="button" class="user-action-card" data-user-action="activate">
                            <span class="user-action-icon">♙</span>
                            <strong>Activate User</strong>
                            <span>Restore access to the account.</span>
                        </button>
                    </div>
                    <p id="user-actions-message" class="user-actions-message" role="status" aria-live="polite"></p>
                </section>
            </div>

        </main>

        <div id="reset-password-modal" class="modal hidden">
            <div class="modal-overlay" data-action="close-reset-password"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Reset Password</h2>
                    <button type="button" id="close-reset-password" aria-label="Close">×</button>
                </div>
                <p id="reset-password-user-details"></p>
                <form id="reset-password-form">
                    <div class="form-group">
                        <label for="reset-password-input">Temporary Password</label>
                        <input type="password" id="reset-password-input" minlength="8" maxlength="127" required autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="reset-password-confirm">Confirm Temporary Password</label>
                        <input type="password" id="reset-password-confirm" minlength="8" maxlength="127" required autocomplete="new-password">
                    </div>
                    <p class="form-message" id="reset-password-message" role="status" aria-live="polite"></p>
                    <div class="modal-footer">
                        <button type="button" id="cancel-reset-password">Cancel</button>
                        <button type="submit" id="save-reset-password">Reset Password</button>
                    </div>
                </form>
            </div>
        </div>


    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/components/sidebar/sidebar.js"></script>
    <script src="/components/topbar/topbar.js"></script>
    <script src="/settings/users/users.js"></script>
</body>
</html>
