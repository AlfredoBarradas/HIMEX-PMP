<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PMP Settings</title>
    <link rel="icon" href="/pmp-favicon.ico">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/settings/settings.css">
</head>

<body data-page="Settings" data-admin-only="true" class="auth-pending">
    <div class="app">

        <div id="sidebar-container"></div>

        <main class="main-content">
            <header id="topbar-container"></header>

            <section class="content">
                <div class="settings-header">
                    <div>
                        <h1>Settings</h1>
                        <p>Manage users, roles and administrative configuration.</p>
                    </div>
                </div>

                <section class="settings-grid" aria-label="Settings navigation">
                    <a class="settings-card" href="/settings/roles/roles.html">
                        <span class="settings-card-icon">RO</span>
                        <span class="settings-card-content">
                            <strong>Roles</strong>
                            <span>Configure access roles and module permissions.</span>
                        </span>
                        <span class="settings-card-action">Open</span>
                    </a>

                    <a class="settings-card" href="/settings/users/">
                        <span class="settings-card-icon">US</span>
                        <span class="settings-card-content">
                            <strong>Users</strong>
                            <span>Create users, update roles and manage account status.</span>
                        </span>
                        <span class="settings-card-action">Open</span>
                    </a>

                    <button class="settings-card settings-card-disabled" type="button" disabled>
                        <span class="settings-card-icon">WF</span>
                        <span class="settings-card-content">
                            <strong>Workflow</strong>
                            <span>Workflow configuration will be added later.</span>
                        </span>
                        <span class="settings-card-action">Pending</span>
                    </button>
                </section>
            </section>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/components/sidebar/sidebar.js"></script>
    <script src="/components/topbar/topbar.js"></script>
    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

</body>

</html>
