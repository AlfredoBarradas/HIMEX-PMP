<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PMP Part Numbers</title>
    <link rel="icon" href="/pmp-favicon.png">

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/components/sidebar/sidebar.css">
    <link rel="stylesheet" href="/components/topbar/topbar.css">
    <link rel="stylesheet" href="./part.css">
</head>

<body 
data-page="partsPage" 
data-page-title="Part Numbers" 
data-page-description="Standar information"
class="auth-pending">

    <div class="app">
        
        <div id="sidebar-container"></div>
        
        <main class="main-content">
            <header id="topbar-container"></header>

            <section class="content">
                
                <!-- Header -->
                <section class="section-header-pn">
                    <div class="menu-header">
                        <div>
                            <h2>PMP INJECTION & STAMPING</h2>
                            <strong>Part Number Standard</strong>
                        </div>
                        <div>
                            <p>Last update: <span>November 25, 2026</span></p>
                        </div>
                    </div>
                </section>
                <!-- Menu -->
                <section class="section-menu">
                    <div class="menu-grid">
                        <div class="menu-group"><button type="button" id="create-pn-button" class="primary-button">Create New Part Number</button></div>
                        <div class="menu-group"><button type="button" id="update-pn-button" class="secondary-button">Update Part Number</button></div>
                    </div>
                </section>
                <!-- Filters -->
                <section class="section-filter-pn">
                    <div>
                        <div class="index-search">
                            <label for="part-search-box">Search by workshop, name, model, size, etc.</label>
                            <input type="text" id="part-search-box" placeholder="Search part number data...">
                        </div>
                        <div class="index-filter">
                            <div class="filter-group"><label for="filter-workshop">Workshop</label><select id="filter-workshop"><option value="">All</option></select></div>
                            <div class="filter-group"><label for="filter-name">Part name</label><select id="filter-name"><option value="">All</option></select></div>
                            <div class="filter-group"><label for="filter-model">Model</label><select id="filter-model"><option value="">All</option></select></div>
                            <div class="filter-group"><label for="filter-size">Size</label><select id="filter-size"><option value="">All</option></select></div>
                            <div class="filter-group"><label for="filter-status">Status</label><select id="filter-status"><option value="">All</option></select></div>
                        </div>
                        <div class="index-filter-action">
                            <button type="button" id="index-filter-clear" class="secondary-button">Clear Filter</button>
                        </div>
                    </div>
                </section>
                <!-- Table -->
                <section class="section-index-pn">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Model</th>
                                    <th>Part Number</th>
                                    <th>Part Name</th>
                                    <th>Description</th>
                                    <th>Workshop</th>
                                    <th>Status</th>
                                    <th>Structure</th>
                                    <th>Size</th>
                                    <th>Model Series</th>
                                    <th>UPH</th>
                                    <th>Headcount</th>
                                </tr>
                            </thead>
                            <tbody id="index-body-pn">
                            </tbody>
                        </table>
                    </div>
                </section>
                
            </section>

        </main>

        <!-- New part number -->
        <section hidden>
            <div>
                <h3>Part number creation</h3>
            </div>
        </section>
        <!-- New part number -->
        <section hidden>
            <div>
                <h3>Part number editor</h3>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    
    <script src="/components/sidebar/sidebar.js"></script>
    <script src="/components/topbar/topbar.js"></script>
    <script src="./part.js"></script>
</body>
</html>
