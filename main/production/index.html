<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PMP Production</title>
    <link rel="icon" href="/pmp-favicon.ico">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/main/production/production.css">
</head>

<body 
data-page="production" 
data-page-title="Production Management" 
data-page-description="Process Overview" 
class="auth-pending">

    <div class="app">
        
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header id="topbar-container"></header>
            
            <section class="content">
                <section class="dashboard-top">
                    <div class="dashboard-top-header">
                        <h2>Production Dashboard</h2>
                    </div>
                    <div class="dashboard-top-info">
                        <div class="dashboard-top-grid">
                            <div class="dashboard-top-tile">
                                <span>Line</span>
                                <strong>1</strong>
                            </div>
                            <div class="dashboard-top-tile">
                                <span>Attendance</span>
                                <strong>0</strong>
                            </div>
                            <div class="dashboard-top-tile">
                                <span>Budget</span>
                                <strong>50</strong>
                            </div>
                            <div class="dashboard-top-tile">
                                <span>Physical vs Target</span>
                                <strong>0</strong>
                            </div>
                            <div class="dashboard-top-tile">
                                <span>Total Losstime</span>
                                <strong>100</strong>
                            </div>

                        </div>
                    </div>
                </section>
                <section>
                    <div class="catalog-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Hour</th>
                                    <th>Part Number</th>
                                    <th>Model</th>
                                    <th>UPH Target</th>
                                    <th>UPH Output</th>
                                    <th>Diff</th>
                                    <th>Losstime (min)</th>
                                    <th>Station</th>
                                    <th>Reason</th>
                                    <th>Department</th>
                                    <th>NG qty</th>
                                    <th>Condition</th>
                                    <th>Countermeasure</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        6:30 - 7:30
                                    </td>
                                    <td>
                                        T450612
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        7:30 - 8:30
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </section>







        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    
    <script src="/components/sidebar/sidebar.js"></script>
    <script src="/components/topbar/topbar.js"></script>
    
</body>
</html>
