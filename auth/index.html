<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMP Management Center - Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/auth/auth.css">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-mark">PMP</div>
                <div>
                    <div class="brand-name">Management Center</div>
                    <div class="brand-caption">Himex Plastic and Metal Parts</div>
                </div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-employee-number">Employee Number</label>
                    <input
                        type="text"
                        id="login-employee-number"
                        name="employee_number"
                        autocomplete="username"
                        inputmode="numeric"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>
                <button type="submit" class="primary-button">Log in</button>
                <p id="login-message" class="auth-message"></p>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/auth/auth.js"></script>
</body>
</html>
