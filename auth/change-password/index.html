
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMP Management Center - Change Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/auth/auth.css">
    <link rel="stylesheet" href="/auth/change-password/change-password.css">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body data-page="Change Password">
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-header">
                <h1>PMP</h1>
                <p>PMP Management Center</p>
            </div>
            <div class="change-password-heading">
                <h2>Change Password</h2>
                <p>You must create a new password before continuing.</p>
            </div>
            <form id="change-password-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input
                        type="password"
                        id="new-password"
                        name="new_password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="127"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="127"
                        required
                    >
                </div>
                <p id="change-password-message" class="auth-message" role="status" aria-live="polite"></p>
                <button type="submit" id="change-password-button" class="primary-button">
                    Update Password
                </button>
            </form>

            <button type="button" id="back-to-login-button" class="secondary-button">
                Sign out and return to login
            </button>

        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/auth/change-password/change-password.js"></script>
</body>
</html>
